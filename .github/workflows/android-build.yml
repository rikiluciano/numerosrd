name: Compilación Automática Android

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para publicar el Release automáticamente

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Dar permisos de ejecución a Gradle
      run: chmod +x gradlew

    - name: Compilar APK
      run: ./gradlew assembleDebug

    - name: Preparar fecha
      run: echo "FECHA=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

    - name: Publicar en GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.0.${{ github.run_number }}"
        name: "Actualización v1.0.${{ github.run_number }} 🚀"
        body: "APK generado y publicado automáticamente. (Fecha: ${{ env.FECHA }})"
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
